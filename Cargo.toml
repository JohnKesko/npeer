[workspace]
resolver = "3"
members = ["crates/npeer-core", "crates/npeer"]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/JohnKesko/npeer"
authors = ["johnkesko"]

[workspace.dependencies]
npeer-core = { path = "crates/npeer-core", version = "0.2.0-beta.1" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
console = "0.16"
directories-next = "2"
hex = "0.4"
indicatif = "0.18"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
spinners = "4"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "fs",
    "time",
    "sync",
    "signal",
] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
