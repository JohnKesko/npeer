[package]
name = "npeer"
description = "A fast, friendly BitTorrent client for the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "npeer"
path = "src/main.rs"

[features]
default = ["upgrade"]
# The built-in `npeer upgrade` command. Package maintainers (Homebrew,
# apt, ...) should build with --no-default-features so updates stay in
# the package manager's hands.
upgrade = [
    "dep:reqwest",
    "dep:hex",
    "dep:sha2",
    "dep:self-replace",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
]

[dependencies]
npeer-core.workspace = true

anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
console.workspace = true
directories-next.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
spinners.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# `npeer upgrade` only.
reqwest = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }
self-replace = { version = "1.5", optional = true }

[target.'cfg(unix)'.dependencies]
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }

[target.'cfg(windows)'.dependencies]
zip = { version = "8", optional = true, default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
