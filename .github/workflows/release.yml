# Release pipeline: push a tag like `v0.1.0` (or `v0.2.0-beta.1` for a
# beta) and this workflow tests the code, builds every supported
# platform, and publishes a GitHub Release with ready-to-run archives.
#
# Adding a platform = adding one matrix entry.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: tar
          # GitHub retired its Intel macOS runners; Apple Silicon runners
          # cross-compile x86_64 macOS binaries natively.
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p npeer

      # Asset names carry no version so install commands can always use
      # .../releases/latest/download/npeer-<target>.tar.gz. The version is
      # in the release tag and in `npeer --version`.
      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          name="npeer-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/npeer" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -r "dist/${name}"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "npeer-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/npeer.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: npeer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      # Tags with a suffix (v0.2.0-beta.1) are betas: published as
      # pre-releases, so they never become "latest" and only reach
      # `npeer upgrade --beta`.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
